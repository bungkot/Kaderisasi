# Active override for the native 8 GB Linux host.
# Loaded automatically by `docker compose`.

services:
  ollama:
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_FLASH_ATTENTION: "1"
    mem_limit: 4g

  model-init:
    mem_limit: 256m
    command:
      - "ollama pull huihui_ai/qwen3.5-abliterated:4B"

  juice-shop:
    mem_limit: 192m

  harness:
    mem_limit: 1536m
    command:
      - node
      - dist/index.js
      - run
      - --tasks
      - /app/harness/tasks
      - --models
      - ollama/huihui_ai/qwen3.5-abliterated:4B
      - --runs
      - "1"
      - --target
      - http://juice-shop:3000
      - --seed
      - "42"
      - --out
      - /data/runs
      - --workspace-root
      - /app/harness/workspaces
      - --ollama-base-url
      - http://ollama:11434/v1
      - --timeout-ms
      - "900000"
