apiVersion: apps/v1
kind: Deployment
metadata:
  name: satpam-guard
  namespace: satpam-benchmark
  labels:
    app: satpam-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: satpam-guard
  template:
    metadata:
      labels:
        app: satpam-guard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guard
          image: python:3.12-slim
          command: ["python", "/opt/guard/guard.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ALLOWED_HOSTS
              value: juice-shop.juice-shop.svc.cluster.local:3000
            - name: RATE_LIMIT_RPS
              value: "10"
            - name: MAX_BODY_BYTES
              value: "1048576"
          volumeMounts:
            - name: script
              mountPath: /opt/guard
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
      volumes:
        - name: script
          configMap:
            name: satpam-guard-script
---
apiVersion: v1
kind: Service
metadata:
  name: satpam-guard
  namespace: satpam-benchmark
  labels:
    app: satpam-guard
spec:
  type: ClusterIP
  selector:
    app: satpam-guard
  ports:
    - port: 8080
      targetPort: http
      name: http
