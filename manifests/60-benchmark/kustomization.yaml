apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ollama.yaml
  - guard.yaml
  - juice-shop.yaml
  - executor.yaml
  - networkpolicy.yaml
  - runner-job.yaml
  - monitoring.yaml
configMapGenerator:
  - name: satpam-guard-script
    namespace: satpam-benchmark
    files:
      - guard.py=../../scripts/guard.py
generatorOptions:
  disableNameSuffixHash: true
